name: Build and Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.2.3)'
        required: false
        default: ''
      prerelease:
        description: '是否为预发布版本'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.2'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Extract Version Information
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/' | tr -d ' ')
            BUILD_NUMBER="${{ github.run_number }}"
            VERSION="${VERSION}-build.${BUILD_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 构建版本: $VERSION"

      - name: Decode Keystore (Release)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/diceroller-release.jks
            echo "✅ Keystore 解码成功"
          else
            echo "⚠️ 未找到 KEYSTORE_BASE64，将使用调试签名构建"
          fi

      - name: Build Debug APK
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew assembleDebug --stacktrace
        continue-on-error: false

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_FILE: app/diceroller-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "app/diceroller-release.jks" ]; then
            echo "🔐 使用发布签名构建..."
            ./gradlew assembleRelease --stacktrace
          else
            echo "🔓 使用调试签名构建 Release APK..."
            ./gradlew assembleRelease --stacktrace
          fi
        continue-on-error: false

      - name: Verify Build Outputs
        run: |
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✅ Release APK 构建成功"
            ls -lh app/build/outputs/apk/release/app-release.apk
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ Debug APK 构建成功"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ 未找到构建产物"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiceRoller-${{ env.VERSION }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate Release Notes
        id: release_notes
        if: github.event_name != 'pull_request'
        run: |
          cat > release_notes.md << 'EOF'
          ## 🎲 DiceRoller ${{ env.VERSION }}

          ### 构建信息
          - **版本**: ${{ env.VERSION }}
          - **构建时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - **提交**: ${{ github.sha }}
          - **分支**: ${{ github.ref_name }}
          - **触发方式**: ${{ github.event_name }}

          ### 功能特性
          - 🎯 真实物理引擎模拟骰子投掷
          - ⚡ 点击越快力度越大
          - 🔷 支持 D4/D6/D8/D10/D12/D20/D100 预设
          - 🎨 自定义骰子颜色
          - 🔊 程序化生成音效
          - 📊 可选显示结果总和
          - 🎲 支持1-10个骰子同时投掷

          ### 安装说明
          1. 下载下方 APK 文件
          2. 在 Android 设备上允许安装未知来源应用
          3. 安装并享受！

          ### 系统要求
          - Android 7.0+ (API 24)
          - 约 15MB 存储空间
          EOF
          echo "✅ 发布说明已生成"

      - name: Create GitHub Release
        if: |
          github.event_name != 'pull_request' && (
            github.ref == 'refs/heads/main' || 
            github.ref == 'refs/heads/master' || 
            startsWith(github.ref, 'refs/tags/v')
          )
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: DiceRoller v${{ env.VERSION }}
          body_path: release_notes.md
          prerelease: ${{ github.event.inputs.prerelease == 'true' || contains(env.VERSION, 'build') }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "=========================================="
          echo "📋 构建摘要"
          echo "=========================================="
          echo "版本: ${{ env.VERSION }}"
          echo "状态: ${{ job.status }}"
          echo "触发: ${{ github.event_name }}"
          echo "提交: ${{ github.sha }}"
          echo "=========================================="

  notify:
    name: Notify Build Status
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Status Notification
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ 构建成功完成！"
          elif [ "${{ needs.build.result }}" == "failure" ]; then
            echo "❌ 构建失败，请检查上方日志"
            exit 1
          else
            echo "⚠️ 构建状态: ${{ needs.build.result }}"
          fi
