name: Build and Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2.3)'
        required: false
        default: ''
      prerelease:
        description: 'Pre-release version'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      keystore_base64:
        description: 'Base64 encoded keystore'
        required: false
        default: ''
      keystore_password:
        description: 'Keystore password'
        required: false
        default: ''
      key_alias:
        description: 'Key alias'
        required: false
        default: ''
      key_password:
        description: 'Key password'
        required: false
        default: ''

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.5'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Extract Version Information
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/' | tr -d ' ')
            BUILD_NUMBER="${{ github.run_number }}"
            VERSION="${VERSION}-build.${BUILD_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Build version: $VERSION"

      - name: Build Debug APK
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew assembleDebug --stacktrace
        continue-on-error: false

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        run: |
          echo "🔐 Building with release signing..."
          ./gradlew assembleRelease --stacktrace
        continue-on-error: false

      - name: Verify Build Outputs
        run: |
          echo "=== Checking build outputs ==="
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "APK directory does not exist"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "Release directory does not exist"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug directory does not exist"
          echo "=============================="
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✅ Signed Release APK built successfully"
            ls -lh app/build/outputs/apk/release/app-release.apk
            APK_SIZE=$(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> $GITHUB_ENV
            echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
            echo "SIGNED=true" >> $GITHUB_ENV
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "✅ Unsigned Release APK built successfully"
            ls -lh app/build/outputs/apk/release/app-release-unsigned.apk
            APK_SIZE=$(du -h app/build/outputs/apk/release/app-release-unsigned.apk | cut -f1)
            echo "APK_PATH=app/build/outputs/apk/release/app-release-unsigned.apk" >> $GITHUB_ENV
            echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
            echo "SIGNED=false" >> $GITHUB_ENV
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ Debug APK built successfully"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            APK_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
            echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
            echo "SIGNED=false" >> $GITHUB_ENV
          else
            echo "❌ No build artifacts found"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiceRoller-${{ env.VERSION }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate Release Notes
        id: release_notes
        if: github.event_name != 'pull_request'
        run: |
          cat > release_notes.md << 'EOF'
          ## 🎲 DiceRoller v${{ env.VERSION }}

          ### Build Information
          - **Version**: ${{ env.VERSION }}
          - **Build Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}
          - **Trigger**: ${{ github.event_name }}
          - **APK Size**: ${{ env.APK_SIZE }}
          - **Signed**: ${{ env.SIGNED }}

          ### Features
          - 🎯 Realistic physics engine for dice rolling simulation
          - ⚡ Tap faster for more force
          - 🔷 Support for D4/D6/D8/D10/D12/D20/D100 presets
          - 🎨 Customizable dice colors
          - 🔊 Procedurally generated sound effects
          - 📊 Optional result sum display
          - 🎲 Roll 1-10 dice simultaneously

          ### Installation
          1. Download the APK file below
          2. Enable "Install from unknown sources" on your Android device
          3. Install and enjoy!

          ### System Requirements
          - Android 7.0+ (API 24)
          - ~15MB storage space
          EOF
          echo "✅ Release notes generated"

      - name: Create GitHub Release
        if: |
          github.event_name != 'pull_request' && (
            github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/master' ||
            startsWith(github.ref, 'refs/tags/v')
          )
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: DiceRoller v${{ env.VERSION }}
          body_path: release_notes.md
          prerelease: ${{ github.event.inputs.prerelease == 'true' || contains(env.VERSION, 'build') }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "=========================================="
          echo "📋 Build Summary"
          echo "=========================================="
          echo "Version: ${{ env.VERSION }}"
          echo "Status: ${{ job.status }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Signed: ${{ env.SIGNED }}"
          echo "Commit: ${{ github.sha }}"
          echo "=========================================="

  notify:
    name: Notify Build Status
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Status Notification
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Build completed successfully!"
          elif [ "${{ needs.build.result }}" == "failure" ]; then
            echo "❌ Build failed, please check the logs above"
            exit 1
          else
            echo "⚠️ Build status: ${{ needs.build.result }}"
          fi
